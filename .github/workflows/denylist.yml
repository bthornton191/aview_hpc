name: denylist

# This repository is public. Fail on site/customer/project-specific strings.
on:
  push:
  pull_request:

jobs:
  denylist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scan tracked files
        run: python scripts/check_denylist.py
